spring:
  config:
    import: optional:classpath:anisphere-microservice.yaml
  application:
    name: ani-video
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ani_sphere?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ik101145}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
      enabled: true

server:
  port: 9091

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

## 视频/视频封面文件上传根目录(相对 JVM 工作目录)
## 启动时由 VideoUploadStaticConfig 自动创建,无需手工 mkdir
## 通过 URL 命名空间 /uploads/video/** 访问,网关按这个前缀路由
file:
  ## 本地开发可改成绝对路径,如 D:/anivideo/uploads/video
  upload-dir: ./uploads/video
